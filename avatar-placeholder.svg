<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <rect width="480" height="480" fill="#04060a"/>
  <!-- Mask silhouette -->
  <ellipse cx="240" cy="220" rx="130" ry="160" fill="#0a0e14" stroke="#1a2030" stroke-width="1.5"/>
  <!-- Visor area -->
  <ellipse cx="240" cy="200" rx="110" ry="80" fill="#070c14" stroke="#11161f" stroke-width="1"/>
  <!-- Left eye glow -->
  <ellipse cx="205" cy="195" rx="28" ry="20" fill="#001a20" stroke="#00e5ff" stroke-width="1.5"/>
  <ellipse cx="205" cy="195" rx="18" ry="12" fill="#004060"/>
  <ellipse cx="205" cy="195" rx="10" ry="7" fill="#00b8d9"/>
  <ellipse cx="205" cy="195" rx="5" ry="3.5" fill="#00e5ff"/>
  <!-- Left eye bloom -->
  <ellipse cx="205" cy="195" rx="28" ry="20" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="205" cy="195" rx="38" ry="28" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <!-- Right eye glow -->
  <ellipse cx="275" cy="195" rx="28" ry="20" fill="#001a20" stroke="#00e5ff" stroke-width="1.5"/>
  <ellipse cx="275" cy="195" rx="18" ry="12" fill="#004060"/>
  <ellipse cx="275" cy="195" rx="10" ry="7" fill="#00b8d9"/>
  <ellipse cx="275" cy="195" rx="5" ry="3.5" fill="#00e5ff"/>
  <!-- Right eye bloom -->
  <ellipse cx="275" cy="195" rx="28" ry="20" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="275" cy="195" rx="38" ry="28" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <!-- Red drip -->
  <path d="M248 295 Q248 320 243 355 Q241 370 240 380" stroke="#ff2a3d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="240" cy="382" r="4" fill="#ff2a3d" opacity="0.8"/>
  <!-- Mask details: chrome highlights -->
  <path d="M160 180 Q170 160 185 155" stroke="#c8d0d8" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M320 180 Q310 160 295 155" stroke="#c8d0d8" stroke-width="0.8" fill="none" opacity="0.3"/>
  <!-- Chin detail -->
  <path d="M185 300 Q240 320 295 300" stroke="#1a2030" stroke-width="1" fill="none"/>
  <!-- Ambient glow filter sim -->
  <ellipse cx="240" cy="195" rx="60" ry="45" fill="none" stroke="#00e5ff" stroke-width="0.3" opacity="0.08"/>
</svg>
